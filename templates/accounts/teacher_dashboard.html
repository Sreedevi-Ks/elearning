{% extends 'base.html' %}

{% block title %}
Teacher Dashboard
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        👋 Welcome, {{ request.user.username }}
    </h2>

    <h4 class="text-muted mb-4">
        Teacher Dashboard
    </h4>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center p-3">

                <h5>Total Courses</h5>

                <h2>5</h2>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center p-3">

                <h5>Total Students</h5>

                <h2>120</h2>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow text-center p-3">

                <h5>Total Earnings</h5>

                <h2>₹25,000</h2>

            </div>

        </div>

    </div>

    <h4 class="mt-5 mb-3">
        Quick Actions
    </h4>

    <div class="row">

        <div class="col-md-3 mb-3">
            <a href="{% url 'add_course' %}" class="btn btn-primary w-100">
                Add Course
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'my_courses' %}" class="btn btn-success w-100">
                My Courses
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'my_students' %}" class="btn btn-warning w-100">
                My Students
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="{% url 'teacher_payments' %}" class="btn btn-info w-100">
                Payments
            </a>
        </div>

    </div>

</div>

{% endblock %}
