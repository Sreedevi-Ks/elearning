{% extends 'base.html' %}

{% block title %}
Add Assignment
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">

            Add Assignment

        </h2>

        <form
            method="POST"
            enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary">

                Save Assignment

            </button>

            <a
                href="{% url 'course_detail' course.id %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
