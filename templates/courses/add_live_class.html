{% extends 'base.html' %}

{% block title %}
Schedule Live Class
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">

            Schedule Live Class

        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary">

                Schedule

            </button>

        </form>

    </div>

</div>

{% endblock %}
