{% extends 'base.html' %}

{% block title %}
Delete Quiz
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-danger">

            Delete Quiz

        </h2>

        <hr>

        <p>

            Are you sure you want to delete this quiz?

        </p>

        <p>

            <strong>{{ quiz.question }}</strong>

        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger">

                Yes, Delete

            </button>

            <a
                href="{% url 'lesson_detail' quiz.lesson.id %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
